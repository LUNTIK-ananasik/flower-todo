/* ===== ТЕБЕНЬКОВА ЕКАТЕРИНА МИХАЙЛОВНА ИСИП-413 ===== */
/* ===== прилодение создано по мотивам заметокк на телефоне, только мое приложение красивое ===== */

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#d98eac">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Задачи">
    <title>Мои задачи</title>
    <link rel="manifest" href='data:application/manifest+json,{"name":"Мои задачи","short_name":"Задачи","start_url":".","display":"standalone","background_color":"%23fff7f8","theme_color":"%23d98eac","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%B7%3C/text%3E%3C/svg%3E","sizes":"any","type":"image/svg+xml"}]}'>
    <style>
        * {
            box-sizing: border-box
        }

        :root {
            --bg1: #fff7f8;
            --bg2: #f7f4ff;
            --bg3: #f4faef;
            --card: rgba(255,255,255,.94);
            --border: #f3dce5;
            --text: #51434a;
            --muted: #a58b98;
            --accent: #d98eac;
            --accent2: #c97899;
            --done: #b7aab0;
            --shadow: #b9829a20;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg1: #241c22;
                --bg2: #1e1a26;
                --bg3: #1b231c;
                --card: rgba(40,32,38,.94);
                --border: #4a3a44;
                --text: #ece2e8;
                --muted: #9a8794;
                --accent: #c97899;
                --accent2: #b36585;
                --done: #6f6068;
                --shadow: #00000040;
            }
        }

        html, body {
            height: 100%
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px 14px;
            font-family: "Trebuchet MS",Arial,sans-serif;
            color: var(--text);
            background: radial-gradient(circle at 10% 15%,#ffe5ee 0 7%,transparent 7.5%), radial-gradient(circle at 90% 80%,#e8f2df 0 9%,transparent 9.5%), linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3))
            }
        }
        /* ===== цветочки на общем фоне ===== */
        .bg-flowers {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden
        }

            .bg-flowers::before, .bg-flowers::after {
                content: "";
                position: absolute;
                inset: 0;
                background-repeat: no-repeat;
                opacity: .55
            }

            .bg-flowers::before {
                background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>"), url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌷</text></svg>"), url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌼</text></svg>"), url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌺</text></svg>"), url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>");
                background-size: 70px 70px,70px 70px,60px 60px,80px 80px,65px 65px;
                background-position: 80px 60px,75% 120px,20% 45%,85% 70%,45% 88%;
            }

            .bg-flowers::after {
                background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>"), url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>"), url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌼</text></svg>"), url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌷</text></svg>");
                background-size: 80px 80px,55px 55px,65px 65px,60px 60px;
                background-position: 92% 40%,30% 15%,60% 55%,8% 65%;
                opacity: .4;
            }

        @media (prefers-color-scheme: dark) {
            .bg-flowers::before {
                opacity: .35
            }

            .bg-flowers::after {
                opacity: .25
            }
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 10px auto;
            padding: 26px 20px 22px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 25px;
            box-shadow: 0 12px 35px var(--shadow);
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 4px
        }

        .account-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 20px;
        }

            .account-btn:hover {
                background: var(--border);
                color: var(--text)
            }

        .avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
        }

        .flowers {
            text-align: center;
            font-size: 26px;
            letter-spacing: 6px;
            margin-bottom: 6px
        }

        h1 {
            text-align: center;
            margin: 2px 0 6px;
            color: var(--accent);
            font-family: Georgia,serif;
            font-size: 30px
        }

        .hint {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            margin: 0 0 4px
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin: 20px 0 6px
        }

        input[type=text], input[type=password] {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: transparent;
            color: var(--text);
            font-family: inherit;
        }

            input[type=text]:focus, input[type=password]:focus {
                border-color: var(--accent)
            }

        button {
            border: 0;
            border-radius: 12px;
            padding: 12px 15px;
            background: var(--accent);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: .18s;
            font-family: inherit;
        }

            button:hover {
                background: var(--accent2)
            }

            button:active {
                transform: scale(.97)
            }

        .toast {
            text-align: center;
            font-size: 13px;
            color: var(--accent);
            min-height: 18px;
            opacity: 0;
            transition: opacity .25s;
            margin-bottom: 6px
        }

            .toast.show {
                opacity: 1
            }

        .filters {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin: 12px 0 4px;
            flex-wrap: wrap
        }

            .filters button {
                background: transparent;
                color: var(--muted);
                border: 1px solid var(--border);
                padding: 6px 12px;
                font-size: 13px;
                border-radius: 20px;
            }

                .filters button.active {
                    background: var(--accent);
                    color: #fff;
                    border-color: var(--accent)
                }

        .search-row {
            margin: 6px 0 4px
        }

            .search-row input {
                width: 100%
            }

        /* ===== Список и фикс. высота ===== */
        ul {
            list-style: none;
            padding: 0;
            margin: 10px 0 0;
            max-height: 340px;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 8px;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) transparent;
        }

            ul::-webkit-scrollbar {
                width: 8px
            }

            ul::-webkit-scrollbar-track {
                background: transparent;
                border-radius: 8px
            }

            ul::-webkit-scrollbar-thumb {
                background: var(--accent);
                border-radius: 8px;
                border: 2px solid transparent;
                background-clip: padding-box
            }

                ul::-webkit-scrollbar-thumb:hover {
                    background: var(--accent2);
                    background-clip: padding-box;
                    border: 2px solid transparent
                }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 4px;
            border-bottom: 1px solid var(--border);
            animation: pop .2s ease;
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: translateY(4px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        li.fade-out {
            animation: fadeOut .28s ease forwards
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateX(20px)
            }
        }

        .heart {
            background: transparent;
            border: 0;
            padding: 4px;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            transition: transform .15s;
            flex: none;
        }

            .heart:hover {
                background: transparent;
                transform: scale(1.2)
            }

            .heart:active {
                transform: scale(.9)
            }

        li.done span {
            color: var(--done);
            text-decoration: line-through
        }

        li span {
            flex: 1;
            overflow-wrap: anywhere;
            cursor: text
        }

        .delete {
            background: #c5a5b4;
            padding: 7px 10px;
            font-size: 13px
        }

            .delete:hover {
                background: #ad8799
            }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 16px 0
        }

        .counter {
            color: var(--muted);
            font-size: 13px;
            text-align: center;
            margin: 18px 0 0
        }

        .clear-done {
            display: block;
            margin: 10px auto 0;
            background: transparent;
            color: var(--muted);
            border: 1px dashed var(--border);
            font-size: 12px;
            padding: 6px 12px;
        }

            .clear-done:hover {
                color: var(--accent2);
                border-color: var(--accent2);
                background: transparent
            }

        .bottom-flower {
            text-align: center;
            font-size: 20px;
            margin-top: 16px
        }

        /* ===== квадратик аккаунта ===== */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,.35);
            padding: 20px;
        }

            .modal.open {
                display: flex
            }

        .modal-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 24px 20px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 20px 50px #00000040;
            animation: pop .25s ease;
        }

            .modal-card h2 {
                margin: 0 0 14px;
                color: var(--accent);
                font-family: Georgia,serif;
                font-size: 22px;
                text-align: center
            }

            .modal-card .field {
                margin-bottom: 10px
            }

                .modal-card .field label {
                    display: block;
                    font-size: 12px;
                    color: var(--muted);
                    margin-bottom: 4px
                }

                .modal-card .field input {
                    width: 100%
                }

            .modal-card .actions {
                display: flex;
                gap: 8px;
                margin-top: 14px
            }

                .modal-card .actions button {
                    flex: 1
                }

            .modal-card .link {
                background: transparent;
                color: var(--accent);
                padding: 6px;
                font-size: 13px;
                text-decoration: underline;
                margin-top: 6px;
                width: 100%;
            }

                .modal-card .link:hover {
                    background: transparent;
                    color: var(--accent2)
                }

            .modal-card .msg {
                font-size: 13px;
                text-align: center;
                min-height: 18px;
                color: var(--accent);
                margin-top: 6px
            }
    </style>
</head>
<body>
    <div class="bg-flowers" aria-hidden="true"></div>

    <main class="app">
        <div class="top-bar">
            <button id="accountBtn" class="account-btn" title="Аккаунт">
                <span class="avatar" id="avatar">?</span>
                <span id="accountName">Войти</span>
            </button>
        </div>

        <div class="flowers" aria-hidden="true">🌷 🌸 🌼 🌸 🌷</div>
        <h1>Мои задачи</h1>
        <p class="hint">Маленькие шаги каждый день ✨</p>

        <div class="input-row">
            <input id="taskInput" type="text" placeholder="Напиши свою задачу..." maxlength="200" autocomplete="off">
            <button id="addButton">Добавить</button>
        </div>
        <div id="toast" class="toast"></div>

        <div class="filters">
            <button data-filter="all" class="active">Все</button>
            <button data-filter="active">Активные</button>
            <button data-filter="done">Выполненные</button>
        </div>

        <div class="search-row">
            <input id="searchInput" type="text" placeholder="🔍 Поиск по задачам..." autocomplete="off">
        </div>

        <ul id="taskList"></ul>
        <p id="emptyMessage" class="empty">Пока задач нет 🌱</p>
        <button id="clearDone" class="clear-done">Очистить выполненные</button>
        <div class="bottom-flower" aria-hidden="true">🌿 🌺 🌿</div>
    </main>

    <!-- пробник аккаунта -->
    <div class="modal" id="accountModal">
        <div class="modal-card">
            <h2 id="modalTitle">Вход</h2>
            <div class="field">
                <label>Логин</label>
                <input id="loginInput" type="text" placeholder="Ваш логин" autocomplete="username">
            </div>
            <div class="field" id="passwordField">
                <label>Пароль</label>
                <input id="passwordInput" type="password" placeholder="Пароль" autocomplete="current-password">
            </div>
            <div class="msg" id="modalMsg"></div>
            <div class="actions" id="authActions">
                <button id="loginBtn">Войти</button>
                <button id="registerBtn" style="background:#c5a5b4">Регистрация</button>
            </div>
            <div class="actions" id="loggedActions" style="display:none">
                <button id="logoutBtn" style="background:#c5a5b4">Выйти</button>
                <button id="closeModalBtn">Закрыть</button>
            </div>
            <button class="link" id="closeModalLink">Закрыть</button>
        </div>
    </div>

    <script>
        const input = document.getElementById("taskInput");
        const list = document.getElementById("taskList");
        const emptyMessage = document.getElementById("emptyMessage");
        const counter = document.getElementById("counter");
        const toastEl = document.getElementById("toast");
        const clearDoneBtn = document.getElementById("clearDone");
        const searchInput = document.getElementById("searchInput");

        const accountBtn = document.getElementById("accountBtn");
        const avatarEl = document.getElementById("avatar");
        const accountName = document.getElementById("accountName");
        const accountModal = document.getElementById("accountModal");
        const modalTitle = document.getElementById("modalTitle");
        const loginInput = document.getElementById("loginInput");
        const passwordInput = document.getElementById("passwordInput");
        const modalMsg = document.getElementById("modalMsg");
        const authActions = document.getElementById("authActions");
        const loggedActions = document.getElementById("loggedActions");
        const loginBtn = document.getElementById("loginBtn");
        const registerBtn = document.getElementById("registerBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const closeModalBtn = document.getElementById("closeModalBtn");
        const closeModalLink = document.getElementById("closeModalLink");

        // ===== Аккаунты =====
        function getUsers() { try { return JSON.parse(localStorage.getItem("myAppUsers")) || {}; } catch { return {}; } }
        function saveUsers(u) { localStorage.setItem("myAppUsers", JSON.stringify(u)); }
        function getCurrentUser() { return localStorage.getItem("myAppCurrentUser") || null; }
        function setCurrentUser(name) { localStorage.setItem("myAppCurrentUser", name); }
        function clearCurrentUser() { localStorage.removeItem("myAppCurrentUser"); }

        function tasksKey() { const u = getCurrentUser(); return u ? "myTasks::" + u : "myTasks::guest"; }

        // ===== Задачки =====
        let tasks = [];
        function loadTasks() {
            const key = tasksKey();
            try {
                const raw = localStorage.getItem(key);
                const parsed = raw ? JSON.parse(raw) : [];
                if (Array.isArray(parsed)) {
                    tasks = parsed.map(t => ({
                        id: t.id ?? (Date.now() + Math.random()),
                        name: String(t.name || ""),
                        done: !!t.done
                    })).filter(t => t.name);
                } else tasks = [];
            } catch { tasks = []; }
        }
        function save() { localStorage.setItem(tasksKey(), JSON.stringify(tasks)); }

        let filter = "all";
        let query = "";

        function toast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add("show");
            clearTimeout(toast._t);
            toast._t = setTimeout(() => toastEl.classList.remove("show"), 1800);
        }

        function updateAccountUI() {
            const user = getCurrentUser();
            if (user) {
                avatarEl.textContent = user.charAt(0).toUpperCase();
                accountName.textContent = user;
            } else {
                avatarEl.textContent = "?";
                accountName.textContent = "Войти";
            }
        }

        function render() {
            list.innerHTML = "";
            const q = query.trim().toLowerCase();
            const visible = tasks.filter(t => {
                if (filter === "active" && t.done) return false;
                if (filter === "done" && !t.done) return false;
                if (q && !t.name.toLowerCase().includes(q)) return false;
                return true;
            });
            const completed = tasks.filter(t => t.done).length;

            visible.forEach(task => {
                const li = document.createElement("li");
                if (task.done) li.classList.add("done");

                const heart = document.createElement("button");
                heart.className = "heart";
                heart.textContent = task.done ? "❤️" : "🤍";
                heart.title = task.done ? "Вернуть в активные" : "Отметить выполненной";
                heart.addEventListener("click", () => {
                    if (!task.done) {
                        // выполненные с анимацией
                        li.classList.add("fade-out");
                        setTimeout(() => {
                            task.done = true;
                            save(); render();
                            toast("Задача выполнена ❤️");
                        }, 260);
                    } else {
                        task.done = false;
                        save(); render();
                    }
                });

                const span = document.createElement("span");
                span.textContent = task.name;
                span.title = "Двойной клик — редактировать";
                span.addEventListener("dblclick", () => {
                    const val = prompt("Редактировать задачу:", task.name);
                    if (val !== null) {
                        const trimmed = val.trim();
                        if (trimmed) { task.name = trimmed; save(); render(); }
                        else toast("Название не может быть пустым 🌸");
                    }
                });

                const del = document.createElement("button");
                del.textContent = "Удалить";
                del.className = "delete";
                del.addEventListener("click", () => {
                    tasks = tasks.filter(t => t.id !== task.id);
                    save(); render();
                });

                li.append(heart, span, del);
                list.appendChild(li);
            });

            emptyMessage.style.display = visible.length === 0 ? "block" : "none";
            emptyMessage.textContent = tasks.length === 0
                ? "Пока задач нет 🌱"
                : "Ничего не найдено 🔍";


            clearDoneBtn.style.display = completed > 0 ? "block" : "none";
        }

        function addTask() {
            const name = input.value.trim();
            if (!name) { toast("Сначала напиши задачу 🌸"); input.focus(); return; }
            tasks.push({ id: Date.now() + Math.random(), name, done: false });
            input.value = "";
            save(); render();
            input.focus();
        }

        document.getElementById("addButton").addEventListener("click", addTask);
        input.addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });

        searchInput.addEventListener("input", () => {
            query = searchInput.value;
            render();
        });

        document.querySelectorAll(".filters button").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                filter = btn.dataset.filter;
                render();
            });
        });

        clearDoneBtn.addEventListener("click", () => {
            tasks = tasks.filter(t => !t.done);
            save(); render();
            toast("Выполненные удалены 🧹");
        });


        function openModal() {
            accountModal.classList.add("open");
            modalMsg.textContent = "";
            const user = getCurrentUser();
            if (user) {
                modalTitle.textContent = "Аккаунт";
                document.getElementById("passwordField").style.display = "none";
                loginInput.value = user;
                loginInput.disabled = true;
                authActions.style.display = "none";
                loggedActions.style.display = "flex";
            } else {
                modalTitle.textContent = "Вход";
                document.getElementById("passwordField").style.display = "block";
                loginInput.value = "";
                loginInput.disabled = false;
                passwordInput.value = "";
                authActions.style.display = "flex";
                loggedActions.style.display = "none";
            }
        }
        function closeModal() { accountModal.classList.remove("open"); }

        accountBtn.addEventListener("click", openModal);
        closeModalBtn.addEventListener("click", closeModal);
        closeModalLink.addEventListener("click", closeModal);
        accountModal.addEventListener("click", e => { if (e.target === accountModal) closeModal(); });

        loginBtn.addEventListener("click", () => {
            const name = loginInput.value.trim();
            const pass = passwordInput.value;
            if (!name || !pass) { modalMsg.textContent = "Заполни логин и пароль"; return; }
            const users = getUsers();
            if (!users[name]) { modalMsg.textContent = "Такого пользователя нет"; return; }
            if (users[name] !== pass) { modalMsg.textContent = "Неверный пароль"; return; }
            setCurrentUser(name);
            updateAccountUI();
            loadTasks();
            render();
            closeModal();
            toast(`Привет, ${name} 🌸`);
        });

        registerBtn.addEventListener("click", () => {
            const name = loginInput.value.trim();
            const pass = passwordInput.value;
            if (!name || !pass) { modalMsg.textContent = "Заполни логин и пароль"; return; }
            if (name.length < 2) { modalMsg.textContent = "Логин слишком короткий"; return; }
            if (pass.length < 3) { modalMsg.textContent = "Пароль минимум 3 символа"; return; }
            const users = getUsers();
            if (users[name]) { modalMsg.textContent = "Такой логин уже есть"; return; }
            users[name] = pass;
            saveUsers(users);
            setCurrentUser(name);
            updateAccountUI();
            loadTasks();
            render();
            closeModal();
            toast(`Аккаунт создан 🌷`);
        });

        logoutBtn.addEventListener("click", () => {
            clearCurrentUser();
            updateAccountUI();
            loadTasks();
            render();
            closeModal();
            toast("Вы вышли 👋");
        });

        // Service worker для офлайн-режима
        if ("serviceWorker" in navigator) {
            const swCode = `
                            self.addEventListener('install', e => self.skipWaiting());
                            self.addEventListener('activate', e => self.clients.claim());
                            self.addEventListener('fetch', e => {
                              e.respondWith(
                                caches.match(e.request).then(r => r || fetch(e.request).then(resp => {
                                  const clone = resp.clone();
                                  caches.open('tasks-v2').then(c => c.put(e.request, clone)).catch(()=>{});
                                  return resp;
                                }).catch(() => caches.match('./')))
                              );
                            });
                          `;
            const blob = new Blob([swCode], { type: "application/javascript" });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(() => { });
        }

        // Старт
        updateAccountUI();
        loadTasks();
        render();
    </script>
</body>
</html>
